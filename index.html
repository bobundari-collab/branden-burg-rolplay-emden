<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polizei Brandenburg – Rollenspielakten</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--n:#101d35;--r:#c92535;--bg:#eef2f7;--line:#d9e0ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182235;font:16px/1.45 system-ui}header{background:var(--n);color:white;padding:22px 16px;border-bottom:5px solid var(--r)}.head,main{max-width:1100px;margin:auto}.head{display:flex;gap:14px;align-items:center}.shield{width:54px;height:62px;background:white;color:var(--r);clip-path:polygon(5% 0,95% 0,90% 72%,50% 100%,10% 72%);display:grid;place-items:center;font-size:30px;font-weight:900}h1{font-size:clamp(20px,4vw,30px);margin:0}header p{margin:3px 0;color:#dce5f3}main{padding:20px 14px}.status,.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}.status,.small,.meta{color:#637089;font-size:13px}.tabs,.actions{display:flex;flex-wrap:wrap;gap:8px}.tabs{margin-bottom:14px}.tabs button,.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.tabs button{background:#dce4ef;color:var(--n)}.tabs button.active{background:var(--n);color:white}.layout{display:grid;grid-template-columns:minmax(250px,350px) 1fr;gap:15px;align-items:start}.panel h2{font-size:19px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:750;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e2;border-radius:7px;font:inherit;background:white}textarea{min-height:110px;resize:vertical}.btn{background:var(--r);color:white;margin-top:12px}.secondary{background:#e4eaf2!important;color:var(--n)!important}.danger{background:#8f1e2a!important}.hidden{display:none!important}.listhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.listhead input{max-width:280px}.case{border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:10px}.case h3{margin:6px 0;font-size:17px;overflow-wrap:anywhere}.tag{background:#e9eef6;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:bold}.desc{white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:#637089}.small{font-size:12px}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.shield{width:44px;height:52px}}
</style></head><body><header><div class="head"><div class="shield">✦</div><div><h1>Polizei Brandenburg</h1><p>Gemeinsame Aktenverwaltung · Rollenspiel</p></div></div></header><main><div class="status" id="status">Verbinde mit der Datenbank …</div><div class="tabs"><button class="active" data-cat="Straftat">Straftat</button><button data-cat="Anzeige">Anzeige</button><button data-cat="Generalakte">Generalakten</button><button data-cat="Alle">Alle Akten</button></div><div class="layout"><section class="panel"><h2 id="formTitle">Neue Akte anlegen</h2><form id="caseForm"><input type="hidden" id="caseId"><label>Aktenart</label><select id="category"><option>Straftat</option><option>Anzeige</option><option>Generalakte</option></select><label>Aktenzeichen</label><input id="number" maxlength="80" placeholder="RP-2026-001"><label>Titel / Betreff *</label><input id="title" required maxlength="180" placeholder="Kurzer Titel des Falls"><label>Beteiligte (nur RP-Namen)</label><input id="people" maxlength="300" placeholder="z. B. Max Beispiel, Einheit 12"><label>Sachverhalt / Notizen</label><textarea id="description" maxlength="12000" placeholder="Beschreibung des fiktiven Rollenspiel-Falls …"></textarea><div class="actions"><button class="btn" type="submit" id="saveBtn">Akte speichern</button><button class="btn secondary hidden" type="button" id="cancelBtn">Abbrechen</button></div><p class="small">Bitte keine echten personenbezogenen oder vertraulichen Daten eintragen.</p></form></section><section class="panel"><div class="listhead"><h2 style="margin:0">Gemeinsame Akten</h2><input id="search" placeholder="Akten durchsuchen …"></div><div id="cases"><p class="empty">Lade Akten …</p></div></section></div></main>
<script>
(()=>{const sb=window.supabase.createClient('https://sjpwierrxyhijfjhzkqj.supabase.co','sb_publishable_u9K0zaYazNsHmwDhXUTE9g_yCSuHaWl');let cases=[],cat='Straftat';const $=id=>document.getElementById(id),status=m=>$('status').textContent=m;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.toLocaleLowerCase('de-DE').trim(),a=cases.filter(c=>(cat==='Alle'||c.kategorie===cat)&&[c.aktenzeichen,c.titel,c.kategorie,c.inhalt?.beteiligte,c.inhalt?.sachverhalt].join(' ').toLocaleLowerCase('de-DE').includes(q));$('cases').innerHTML=a.length?a.map(c=>`<article class="case"><span class="tag">${esc(c.kategorie)}</span><h3>${esc(c.titel)}</h3><div class="meta">${esc(c.aktenzeichen||'Ohne Aktenzeichen')} · ${esc(new Date(c.aktualisiert_am).toLocaleString('de-DE'))}</div>${c.inhalt?.beteiligte?`<p><b>Beteiligte:</b> ${esc(c.inhalt.beteiligte)}</p>`:''}<div class="desc">${esc(c.inhalt?.sachverhalt||'Keine weiteren Notizen.')}</div><div class="actions"><button class="btn secondary" data-edit="${c.id}">Bearbeiten</button><button class="btn danger" data-del="${c.id}">Löschen</button></div></article>`).join(''):'<p class="empty">Keine passenden Akten vorhanden.</p>'}async function load(){let {data,error}=await sb.from('akten').select('*').order('aktualisiert_am',{ascending:false});if(error){status('Datenbankfehler: '+error.message);return}cases=data||[];status('Live-Datenbank verbunden · '+cases.length+' Akte(n) · synchronisiert für alle Spieler.');render()}function reset(){$('caseForm').reset();$('caseId').value='';$('formTitle').textContent='Neue Akte anlegen';$('saveBtn').textContent='Akte speichern';$('cancelBtn').classList.add('hidden')}$('caseForm').addEventListener('submit',async e=>{e.preventDefault();let id=$('caseId').value,p={aktenzeichen:$('number').value.trim(),kategorie:$('category').value,titel:$('title').value.trim(),inhalt:{beteiligte:$('people').value.trim(),sachverhalt:$('description').value.trim()},aktualisiert_am:new Date().toISOString()};status('Speichere …');let r=id?await sb.from('akten').update(p).eq('id',id):await sb.from('akten').insert(p);if(r.error){status('Fehler: '+r.error.message);return}reset();await load()});$('cancelBtn').onclick=reset;$('search').oninput=render;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});$('cases').addEventListener('click',async e=>{let id=e.target.closest('[data-edit]')?.dataset.edit,del=e.target.closest('[data-del]')?.dataset.del;if(id){let c=cases.find(x=>x.id===id);$('caseId').value=c.id;$('category').value=c.kategorie;$('number').value=c.aktenzeichen||'';$('title').value=c.titel||'';$('people').value=c.inhalt?.beteiligte||'';$('description').value=c.inhalt?.sachverhalt||'';$('formTitle').textContent='Akte bearbeiten';$('saveBtn').textContent='Änderungen speichern';$('cancelBtn').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}if(del){let c=cases.find(x=>x.id===del);if(!confirm('Akte „'+c.titel+'“ für alle Spieler löschen?'))return;let {error}=await sb.from('akten').delete().eq('id',del);if(error){status('Löschen fehlgeschlagen: '+error.message);return}await load()}});sb.channel('akten-live').on('postgres_changes',{event:'*',schema:'public',table:'akten'},load).subscribe();load()})();
</script></body></html>
